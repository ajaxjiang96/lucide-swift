name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SWIFT_VERSION: '5.9'

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Run tests
      run: swift test
    
    - name: Build package
      run: swift build
    
    - name: Build release
      run: swift build -c release

    - name: Generate PR preview
      if: github.event_name == 'pull_request'
      run: |
        swift run PreviewGenerator
        mv docs/preview.png docs/preview-pr.png

    - name: Checkout main for preview
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v6
      with:
        ref: main
        path: main-repo

    - name: Generate main preview
      if: github.event_name == 'pull_request'
      run: |
        cd main-repo
        swift run PreviewGenerator
        cp docs/preview.png ../docs/preview-main.png
        cd ..

    - name: Upload preview artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: visual-diff
        path: |
          docs/preview-pr.png
          docs/preview-main.png
