name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SWIFT_VERSION: '5.9'

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run tests
      run: swift test
    
    - name: Build package
      run: swift build
    
    - name: Build release
      run: swift build -c release
