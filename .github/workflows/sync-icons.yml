name: Sync Icons

# This workflow syncs with upstream Lucide Icons
# - Runs daily via cron schedule
# - Can be manually triggered
# - Updates icons but does NOT create releases
# - Library releases are manual via the release workflow

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force sync to specific Lucide version (e.g., 1.8.0)'
        required: false
        default: ''

env:
  SWIFT_VERSION: '5.9'

jobs:
  sync:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get upstream Lucide version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.force_version }}" ]; then
          VERSION="${{ github.event.inputs.force_version }}"
        else
          VERSION=$(curl -s https://api.github.com/repos/lucide-icons/lucide/releases/latest | jq -r .tag_name)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Upstream version: $VERSION"
    
    - name: Check if update needed
      id: check
      run: |
        CURRENT_VERSION=$(cat .lucide-version 2>/dev/null || echo "v0.0.0")
        UPSTREAM_VERSION=${{ steps.version.outputs.version }}
        
        if [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ] || [ -n "${{ github.event.inputs.force_version }}" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Update required: $CURRENT_VERSION → $UPSTREAM_VERSION"
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "Already up to date: $CURRENT_VERSION"
        fi
    
    - name: Run generator
      if: steps.check.outputs.needs_update == 'true'
      id: generate
      run: |
        swift run LucideGenerator
        ICON_COUNT=$(grep -c "case " Sources/LucideSwift/Lucide+Generated.swift || echo "0")
        echo "icon_count=$ICON_COUNT" >> $GITHUB_OUTPUT
    
    - name: Run tests
      if: steps.check.outputs.needs_update == 'true'
      run: swift test
    
    - name: Build release
      if: steps.check.outputs.needs_update == 'true'
      run: swift build -c release
    
    - name: Configure Git
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Update version file and commit
      if: steps.check.outputs.needs_update == 'true'
      run: |
        echo "${{ steps.version.outputs.version }}" > .lucide-version
        git add -A
        git commit -m "chore: sync icons with Lucide ${{ steps.version.outputs.version }}" -m "- Updated icon definitions from upstream Lucide Icons ${{ steps.version.outputs.version }}" -m "- Regenerated Swift code (${{ steps.generate.outputs.icon_count }} icons)" -m "Auto-generated by sync pipeline"
    
    - name: Push changes
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git push

  notify:
    needs: sync
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Print success message
      if: needs.sync.result == 'success' && needs.sync.outputs.needs_update == 'true'
      run: |
        echo "✅ Successfully synced icons to Lucide ${{ needs.sync.outputs.version }}"
        echo "${{ needs.sync.outputs.icon_count }} icons updated"
        echo ""
        echo "Note: This is NOT a release. To release these changes, run the Release workflow."
    
    - name: Print skip message
      if: needs.sync.result == 'success' && needs.sync.outputs.needs_update != 'true'
      run: |
        echo "ℹ️ No update needed - already at latest Lucide version"
    
    - name: Print failure message
      if: needs.sync.result == 'failure'
      run: |
        echo "❌ Failed to sync icons"
        exit 1
