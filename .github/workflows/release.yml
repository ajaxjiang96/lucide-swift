name: Auto Sync and Release

# This workflow automatically syncs with upstream Lucide Icons and creates releases
# - Runs daily via cron schedule
# - Can be manually triggered with optional force_version parameter
# - Creates releases with the same version number as upstream Lucide

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force release this version (e.g., v1.0.0)'
        required: false
        default: ''

env:
  SWIFT_VERSION: '5.9'

jobs:
  check-and-generate:
    runs-on: macos-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      version: ${{ steps.version.outputs.version }}
      icon_count: ${{ steps.generate.outputs.icon_count }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Swift
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: ${{ env.SWIFT_VERSION }}
    
    - name: Get upstream Lucide version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.force_version }}" ]; then
          VERSION="${{ github.event.inputs.force_version }}"
        else
          VERSION=$(curl -s https://api.github.com/repos/lucide-icons/lucide/releases/latest | jq -r .tag_name)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Upstream version: $VERSION"
    
    - name: Check if update needed
      id: check
      run: |
        CURRENT_VERSION=$(cat .lucide-version 2>/dev/null || echo "v0.0.0")
        UPSTREAM_VERSION=${{ steps.version.outputs.version }}
        
        if [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ] || [ -n "${{ github.event.inputs.force_version }}" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Update required: $CURRENT_VERSION → $UPSTREAM_VERSION"
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "Already up to date: $CURRENT_VERSION"
        fi
    
    - name: Run generator
      if: steps.check.outputs.needs_update == 'true'
      id: generate
      run: |
        swift run LucideGenerator
        ICON_COUNT=$(grep -c "case " Sources/LucideSwift/Lucide+Generated.swift || echo "0")
        echo "icon_count=$ICON_COUNT" >> $GITHUB_OUTPUT
    
    - name: Run tests
      if: steps.check.outputs.needs_update == 'true'
      run: swift test
    
    - name: Build release
      if: steps.check.outputs.needs_update == 'true'
      run: swift build -c release

  commit-and-release:
    needs: check-and-generate
    if: needs.check-and-generate.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Update version file
      run: |
        echo "${{ needs.check-and-generate.outputs.version }}" > .lucide-version
    
    - name: Commit changes
      run: |
        git add -A
        git commit -m "chore: sync with Lucide ${{ needs.check-and-generate.outputs.version }}

- Updated icon definitions from upstream Lucide Icons
- Regenerated Swift code (${{ needs.check-and-generate.outputs.icon_count }} icons)

Auto-generated by release pipeline"
    
    - name: Create tag
      run: |
        VERSION="${{ needs.check-and-generate.outputs.version }}"
        git tag -a "$VERSION" -m "Release $VERSION

Synchronized with Lucide Icons $VERSION

Changes:
- Updated to ${{ needs.check-and-generate.outputs.icon_count }} icons
- Auto-generated from upstream"
    
    - name: Push changes and tag
      run: |
        git push
        git push --tags

  create-release:
    needs: commit-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.check-and-generate.outputs.version }}
        name: ${{ needs.check-and-generate.outputs.version }}
        body: |
          ## Lucide Swift ${{ needs.check-and-generate.outputs.version }}

          This release is synchronized with [Lucide Icons](https://github.com/lucide-icons/lucide) ${{ needs.check-and-generate.outputs.version }}.

          ### Summary
          - **Icons:** ${{ needs.check-and-generate.outputs.icon_count }} total icons
          - **Source:** Auto-generated from upstream Lucide release

          ### Installation

          Add to your `Package.swift`:
          ```swift
          dependencies: [
              .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ needs.check-and-generate.outputs.version }}")
          ]
          ```

          ### Usage
          ```swift
          import LucideSwift

          // By string name
          LucideIcon(name: "house", size: 24)
          
          // By enum case
          LucideIcon(.settings, size: 32, color: .blue)
          ```

          ### Full Changelog
          See [upstream Lucide changelog](https://github.com/lucide-icons/lucide/releases/tag/${{ needs.check-and-generate.outputs.version }}) for icon additions and modifications.
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
    - name: Print success message
      run: |
        echo "✅ Successfully released lucide-swift ${{ needs.check-and-generate.outputs.version }}"
        echo ""
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-and-generate.outputs.version }}"
