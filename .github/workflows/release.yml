name: Auto Sync and Release

# This workflow automatically syncs with upstream Lucide Icons and creates releases
# - Runs daily via cron schedule
# - Can be manually triggered with optional force_version parameter
# - Creates releases with the same version number as upstream Lucide

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force release this version (e.g., v1.0.0)'
        required: false
        default: ''

env:
  SWIFT_VERSION: '5.9'

jobs:
  check-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get upstream Lucide version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.force_version }}" ]; then
          VERSION="${{ github.event.inputs.force_version }}"
        else
          VERSION=$(curl -s https://api.github.com/repos/lucide-icons/lucide/releases/latest | jq -r .tag_name)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Upstream version: $VERSION"
    
    - name: Check if update needed
      id: check
      run: |
        CURRENT_VERSION=$(cat .lucide-version 2>/dev/null || echo "v0.0.0")
        UPSTREAM_VERSION=${{ steps.version.outputs.version }}
        
        if [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ] || [ -n "${{ github.event.inputs.force_version }}" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Update required: $CURRENT_VERSION → $UPSTREAM_VERSION"
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "Already up to date: $CURRENT_VERSION"
        fi
    
    - name: Run generator
      if: steps.check.outputs.needs_update == 'true'
      id: generate
      run: |
        swift run LucideGenerator
        ICON_COUNT=$(grep -c "case " Sources/LucideSwift/Lucide+Generated.swift || echo "0")
        echo "icon_count=$ICON_COUNT" >> $GITHUB_OUTPUT
    
    - name: Run tests
      if: steps.check.outputs.needs_update == 'true'
      run: swift test
    
    - name: Build release
      if: steps.check.outputs.needs_update == 'true'
      run: swift build -c release
    
    - name: Configure Git
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Update version file and commit
      if: steps.check.outputs.needs_update == 'true'
      run: |
        echo "${{ steps.version.outputs.version }}" > .lucide-version
        git add -A
        git commit -m "chore: sync with Lucide ${{ steps.version.outputs.version }}" -m "- Updated icon definitions from upstream Lucide Icons" -m "- Regenerated Swift code (${{ steps.generate.outputs.icon_count }} icons)" -m "Auto-generated by release pipeline"
    
    - name: Create tag
      if: steps.check.outputs.needs_update == 'true'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git tag -a "$VERSION" -m "Release $VERSION" -m "Synchronized with Lucide Icons $VERSION" -m "Changes:" -m "- Updated to ${{ steps.generate.outputs.icon_count }} icons" -m "- Auto-generated from upstream"
    
    - name: Push changes and tag
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git push
        git push --tags

    - name: Create GitHub Release
      if: steps.check.outputs.needs_update == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        body: |
          ## Lucide Swift ${{ steps.version.outputs.version }}

          This release is synchronized with [Lucide Icons](https://github.com/lucide-icons/lucide) ${{ steps.version.outputs.version }}.

          ### Summary
          - **Icons:** ${{ steps.generate.outputs.icon_count }} total icons
          - **Source:** Auto-generated from upstream Lucide release

          ### Installation

          Add to your `Package.swift`:
          ```swift
          dependencies: [
              .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ steps.version.outputs.version }}")
          ]
          ```

          ### Usage
          ```swift
          import LucideSwift

          // By string name
          LucideIcon(name: "house", size: 24)
          
          // By enum case
          LucideIcon(.settings, size: 32, color: .blue)
          ```

          ### Full Changelog
          See [upstream Lucide changelog](https://github.com/lucide-icons/lucide/releases/tag/${{ steps.version.outputs.version }}) for icon additions and modifications.
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: check-and-release
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Print success message
      if: needs.check-and-release.result == 'success'
      run: |
        echo "✅ Successfully released lucide-swift ${{ needs.check-and-release.outputs.version }}"
        echo ""
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-and-release.outputs.version }}"
    
    - name: Print skip message
      if: needs.check-and-release.result == 'skipped'
      run: |
        echo "ℹ️ No update needed - already at latest version"
