name: Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run benchmark
        run: |
          cd Benchmarks
          swift run -c release LucideBenchmark

      - name: Upload benchmark report to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Benchmarks/benchmark-report.md

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: Benchmarks/benchmark-report.md
