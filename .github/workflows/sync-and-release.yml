name: Sync and Release

# This workflow automatically syncs with upstream Lucide Icons and creates releases
# - Runs daily via cron schedule
# - Can be manually triggered
# - Auto-increments patch version on icon updates
# - Creates git tags and GitHub releases automatically

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force sync to specific Lucide version (e.g., 1.8.0)'
        required: false
        default: ''

env:
  SWIFT_VERSION: '5.9'

jobs:
  sync-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    outputs:
      library_version: ${{ steps.bump_version.outputs.new_version }}
      lucide_version: ${{ steps.version.outputs.version }}
      icon_count: ${{ steps.generate.outputs.icon_count }}
      needs_update: ${{ steps.check.outputs.needs_update }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get upstream Lucide version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.force_version }}" ]; then
          VERSION="${{ github.event.inputs.force_version }}"
        else
          VERSION=$(curl -s https://api.github.com/repos/lucide-icons/lucide/releases/latest | jq -r .tag_name)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Upstream version: $VERSION"
    
    - name: Check if update needed
      id: check
      run: |
        CURRENT_VERSION=$(cat .lucide-version 2>/dev/null || echo "v0.0.0")
        UPSTREAM_VERSION=${{ steps.version.outputs.version }}
        
        if [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ] || [ -n "${{ github.event.inputs.force_version }}" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Update required: $CURRENT_VERSION → $UPSTREAM_VERSION"
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "Already up to date: $CURRENT_VERSION"
        fi
    
    - name: Get current library version
      if: steps.check.outputs.needs_update == 'true'
      id: current_lib_version
      run: |
        LIB_VERSION=$(cat .library-version 2>/dev/null || echo "0.1.0")
        echo "version=$LIB_VERSION" >> $GITHUB_OUTPUT
        echo "Current library version: $LIB_VERSION"
    
    - name: Bump patch version
      if: steps.check.outputs.needs_update == 'true'
      id: bump_version
      run: |
        CURRENT_VERSION="${{ steps.current_lib_version.outputs.version }}"
        
        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        
        # Remove any pre-release suffix from patch
        PATCH=$(echo "$PATCH" | sed 's/-.*//')
        
        # Increment patch
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Bumped version: $CURRENT_VERSION → $NEW_VERSION"
    
    - name: Run generator
      if: steps.check.outputs.needs_update == 'true'
      id: generate
      run: |
        swift run LucideGenerator
        ICON_COUNT=$(grep -c "case " Sources/LucideSwift/Lucide+Generated.swift || echo "0")
        echo "icon_count=$ICON_COUNT" >> $GITHUB_OUTPUT
    
    - name: Generate Preview Screenshot
      if: steps.check.outputs.needs_update == 'true'
      run: swift run PreviewGenerator
    
    - name: Run tests
      if: steps.check.outputs.needs_update == 'true'
      run: swift test
    
    - name: Build release
      if: steps.check.outputs.needs_update == 'true'
      run: swift build -c release
    
    - name: Configure Git
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Update version files and commit
      if: steps.check.outputs.needs_update == 'true'
      run: |
        NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
        LUCIDE_VERSION="${{ steps.version.outputs.version }}"
        
        # Update both version files
        echo "$LUCIDE_VERSION" > .lucide-version
        echo "$NEW_VERSION" > .library-version
        
        git add -A
        git commit -m "chore: release $NEW_VERSION" -m "- Library version: $NEW_VERSION" -m "- Lucide Icons version: $LUCIDE_VERSION" -m "- ${{ steps.generate.outputs.icon_count }} icons" -m "Auto-generated by sync and release pipeline"
    
    - name: Create tag
      if: steps.check.outputs.needs_update == 'true'
      run: |
        NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
        LUCIDE_VERSION="${{ steps.version.outputs.version }}"
        
        git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION" -m "LucideSwift Library $NEW_VERSION" -m "" -m "Bundled with Lucide Icons $LUCIDE_VERSION" -m "" -m "Changes:" -m "- Updated to ${{ steps.generate.outputs.icon_count }} icons from Lucide $LUCIDE_VERSION" -m "- Auto-generated from upstream"
    
    - name: Push changes and tag
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git push
        git push --tags

    - name: Create GitHub Release
      if: steps.check.outputs.needs_update == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.bump_version.outputs.new_version }}
        name: ${{ steps.bump_version.outputs.new_version }}
        body: |
          ## LucideSwift ${{ steps.bump_version.outputs.new_version }}

          **Library Version:** ${{ steps.bump_version.outputs.new_version }}  
          **Lucide Icons:** ${{ steps.version.outputs.version }}  
          **Total Icons:** ${{ steps.generate.outputs.icon_count }}

          ### Changes
          - Updated icons to Lucide ${{ steps.version.outputs.version }}
          - Auto-generated from upstream

          ### Installation

          Add to your `Package.swift`:
          ```swift
          dependencies: [
              .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ steps.bump_version.outputs.new_version }}")
          ]
          ```

          ### Version Information

          Access version information in your code:
          ```swift
          import LucideSwift
          
          print(LucideVersions.libraryVersion)  // "${{ steps.bump_version.outputs.new_version }}"
          print(LucideVersions.lucideVersion)   // "${{ steps.version.outputs.version }}"
          ```
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: sync-and-release
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Print success message
      if: needs.sync-and-release.result == 'success' && needs.sync-and-release.outputs.needs_update == 'true'
      run: |
        echo "✅ Successfully released LucideSwift ${{ needs.sync-and-release.outputs.library_version }}"
        echo "Library: ${{ needs.sync-and-release.outputs.library_version }}"
        echo "Lucide Icons: ${{ needs.sync-and-release.outputs.lucide_version }}"
        echo "Icons: ${{ needs.sync-and-release.outputs.icon_count }}"
        echo ""
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.sync-and-release.outputs.library_version }}"
    
    - name: Print skip message
      if: needs.sync-and-release.result == 'success' && needs.sync-and-release.outputs.needs_update != 'true'
      run: |
        echo "ℹ️ No update needed - already at latest Lucide version"
    
    - name: Print failure message
      if: needs.sync-and-release.result == 'failure'
      run: |
        echo "❌ Failed to sync and release"
        exit 1
