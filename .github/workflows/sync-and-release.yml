name: Sync and Release

# This workflow automatically syncs with upstream Lucide Icons and creates releases
# - Runs daily via cron schedule
# - Can be manually triggered
# - Auto-increments patch version on icon updates
# - Creates git tags and GitHub releases automatically

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force sync to specific Lucide version (e.g., 1.8.0)'
        required: false
        default: ''

env:
  SWIFT_VERSION: '5.9'

jobs:
  sync-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    outputs:
      library_version: ${{ steps.bump_version.outputs.new_version }}
      lucide_version: ${{ steps.lucide_version.outputs.version }}
      lucide_lab_version: ${{ steps.lucide_lab_version.outputs.version }}
      icon_count: ${{ steps.check_changes.outputs.icon_count }}
      needs_update: ${{ steps.check_changes.outputs.needs_update }}
      update_reason: ${{ steps.check_changes.outputs.update_reason }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get upstream Lucide version
      id: lucide_version
      run: |
        if [ -n "${{ github.event.inputs.force_version }}" ]; then
          VERSION="${{ github.event.inputs.force_version }}"
        else
          VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/lucide-icons/lucide/releases/latest | jq -r .tag_name)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Upstream Lucide version: $VERSION"
    
    - name: Get upstream Lucide Lab commit
      id: lucide_lab_version
      run: |
        # Get the latest commit SHA from lucide-lab main branch
        LAB_COMMIT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/lucide-icons/lucide-lab/commits/main | jq -r .sha)
        echo "version=$LAB_COMMIT" >> $GITHUB_OUTPUT
        echo "Upstream Lucide Lab commit: $LAB_COMMIT"
    
    - name: Check for updates
      id: check_changes
      run: |
        CURRENT_LUCIDE_VERSION=$(cat .lucide-version 2>/dev/null || echo "v0.0.0")
        CURRENT_LAB_VERSION=$(cat .lucide-lab-version 2>/dev/null || echo "")
        UPSTREAM_LUCIDE_VERSION="${{ steps.lucide_version.outputs.version }}"
        UPSTREAM_LAB_VERSION="${{ steps.lucide_lab_version.outputs.version }}"
        
        NEEDS_UPDATE=false
        UPDATE_REASON=""
        
        # Check Lucide main repo
        if [ "$CURRENT_LUCIDE_VERSION" != "$UPSTREAM_LUCIDE_VERSION" ]; then
          NEEDS_UPDATE=true
          UPDATE_REASON="Lucide main updated ($CURRENT_LUCIDE_VERSION → $UPSTREAM_LUCIDE_VERSION)"
          echo "✓ Lucide main has update: $CURRENT_LUCIDE_VERSION → $UPSTREAM_LUCIDE_VERSION"
        else
          echo "✓ Lucide main is up to date: $CURRENT_LUCIDE_VERSION"
        fi
        
        # Check Lucide Lab repo
        if [ "$CURRENT_LAB_VERSION" != "$UPSTREAM_LAB_VERSION" ]; then
          NEEDS_UPDATE=true
          if [ -n "$UPDATE_REASON" ]; then
            UPDATE_REASON="$UPDATE_REASON, Lucide Lab updated"
          else
            UPDATE_REASON="Lucide Lab updated"
          fi
          echo "✓ Lucide Lab has update: ${CURRENT_LAB_VERSION:0:7} → ${UPSTREAM_LAB_VERSION:0:7}"
        else
          echo "✓ Lucide Lab is up to date: ${CURRENT_LAB_VERSION:0:7}"
        fi
        
        # Check if forced
        if [ -n "${{ github.event.inputs.force_version }}" ]; then
          NEEDS_UPDATE=true
          UPDATE_REASON="Forced update to ${{ github.event.inputs.force_version }}"
          echo "✓ Forced update requested"
        fi
        
        echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
        echo "update_reason=$UPDATE_REASON" >> $GITHUB_OUTPUT
        
        if [ "$NEEDS_UPDATE" = "true" ]; then
          echo "Update required: $UPDATE_REASON"
        else
          echo "No update needed - all upstream sources are up to date"
        fi
    
    - name: Get current library version
      if: steps.check_changes.outputs.needs_update == 'true'
      id: current_lib_version
      run: |
        LIB_VERSION=$(cat .library-version 2>/dev/null || echo "0.1.0")
        echo "version=$LIB_VERSION" >> $GITHUB_OUTPUT
        echo "Current library version: $LIB_VERSION"
    
    - name: Bump patch version
      if: steps.check_changes.outputs.needs_update == 'true'
      id: bump_version
      run: |
        CURRENT_VERSION="${{ steps.current_lib_version.outputs.version }}"
        
        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        
        # Remove any pre-release suffix from patch
        PATCH=$(echo "$PATCH" | sed 's/-.*//')
        
        # Increment patch
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Bumped version: $CURRENT_VERSION → $NEW_VERSION"
    
    - name: Update version files
      if: steps.check_changes.outputs.needs_update == 'true'
      run: |
        NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
        LUCIDE_VERSION="${{ steps.lucide_version.outputs.version }}"
        LUCIDE_LAB_VERSION="${{ steps.lucide_lab_version.outputs.version }}"
        
        echo "$LUCIDE_VERSION" > .lucide-version
        echo "$LUCIDE_LAB_VERSION" > .lucide-lab-version
        echo "$NEW_VERSION" > .library-version
        echo "Updated version files:"
        echo "  - Library: $NEW_VERSION"
        echo "  - Lucide: $LUCIDE_VERSION"
        echo "  - Lucide Lab: ${LUCIDE_LAB_VERSION:0:7}"

    - name: Run generator
      if: steps.check_changes.outputs.needs_update == 'true'
      id: generate
      run: |
        swift run --package-path Tools LucideGenerator
        # Count only enum case declarations (4-space indent), not switch branches
        ICON_COUNT=$(grep -c "^    case " Sources/LucideSwift/Lucide+Generated.swift || echo "0")
        echo "icon_count=$ICON_COUNT" >> $GITHUB_OUTPUT

    - name: Update README
      if: steps.check_changes.outputs.needs_update == 'true'
      run: |
        LUCIDE_VERSION="${{ steps.lucide_version.outputs.version }}"
        TOTAL_COUNT="${{ steps.generate.outputs.icon_count }}"
        # Count regular icons separately (used in API reference section)
        REGULAR_COUNT=$(sed -n '/public enum LucideIconName/,/public enum LucideLabIconName/p' Sources/LucideSwift/Lucide+Generated.swift | grep -c "^    case ")
        # Strip leading 'v' if present (e.g. v1.8.0 → 1.8.0)
        BADGE_VERSION="${LUCIDE_VERSION#v}"
        # Update Lucide icons version badge
        sed -i '' "s|Lucide-[0-9.]*-orange|Lucide-${BADGE_VERSION}-orange|g" README.md
        # Update enum cases count (line: "1694 enum cases")
        sed -i '' "s/[0-9]* enum cases/${REGULAR_COUNT} enum cases/g" README.md
        # Update autocomplete reference (line: "all 1694 available icons")
        sed -i '' "s/all [0-9]* available icons/all ${REGULAR_COUNT} available icons/g" README.md
        # Update total icons in Technical Details
        LAB_COUNT=$((TOTAL_COUNT - REGULAR_COUNT))
        sed -i '' "s|\\*\\*Total Icons\\*\\*: [0-9]* icons.*|**Total Icons**: ${TOTAL_COUNT} icons (${REGULAR_COUNT} regular + ${LAB_COUNT} Lab)|g" README.md
        # Update Lab icon count in Features section
        sed -i '' "s/Full integration of [0-9,]*+ experimental icons/Full integration of ${LAB_COUNT}+ experimental icons/g" README.md
        # Update "Browse all X icons" link text
        sed -i '' "s/Browse all [0-9]* icons/Browse all ${REGULAR_COUNT} icons/g" README.md
        echo "README updated: Lucide ${BADGE_VERSION}, ${REGULAR_COUNT} regular + $((TOTAL_COUNT - REGULAR_COUNT)) lab = ${TOTAL_COUNT} total"

    - name: Generate Preview Screenshot
      if: steps.check_changes.outputs.needs_update == 'true'
      run: swift run --package-path Tools PreviewGenerator
    
    - name: Run tests (record snapshot baselines)
      if: steps.check_changes.outputs.needs_update == 'true'
      run: SNAPSHOT_RECORD=1 swift test
    
    - name: Build release
      if: steps.check_changes.outputs.needs_update == 'true'
      run: swift build -c release
    
    - name: Configure Git
      if: steps.check_changes.outputs.needs_update == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Commit changes
      if: steps.check_changes.outputs.needs_update == 'true'
      run: |
        NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
        LUCIDE_VERSION="${{ steps.lucide_version.outputs.version }}"
        UPDATE_REASON="${{ steps.check_changes.outputs.update_reason }}"
        ICON_COUNT="${{ steps.generate.outputs.icon_count }}"
        
        git add -A
        git commit -m "chore: release $NEW_VERSION" -m "- Library version: $NEW_VERSION" -m "- Lucide Icons version: $LUCIDE_VERSION" -m "- $ICON_COUNT icons" -m "Reason: $UPDATE_REASON" -m "Auto-generated by sync and release pipeline"
    
    - name: Create tag
      if: steps.check_changes.outputs.needs_update == 'true'
      run: |
        NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
        LUCIDE_VERSION="${{ steps.lucide_version.outputs.version }}"
        ICON_COUNT="${{ steps.generate.outputs.icon_count }}"
        
        git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION" -m "LucideSwift Library $NEW_VERSION" -m "" -m "Bundled with Lucide Icons $LUCIDE_VERSION" -m "" -m "Changes:" -m "- Updated to $ICON_COUNT icons from Lucide $LUCIDE_VERSION" -m "- Auto-generated from upstream"
    
    - name: Push changes and tag
      if: steps.check_changes.outputs.needs_update == 'true'
      run: |
        git push
        git push --tags

    - name: Create GitHub Release
      if: steps.check_changes.outputs.needs_update == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.bump_version.outputs.new_version }}
        name: ${{ steps.bump_version.outputs.new_version }}
        body: |
          ## LucideSwift ${{ steps.bump_version.outputs.new_version }}

          **Library Version:** ${{ steps.bump_version.outputs.new_version }}  
          **Lucide Icons:** ${{ steps.lucide_version.outputs.version }}  
          **Lucide Lab:** ${{ steps.lucide_lab_version.outputs.version }}  
          **Total Icons:** ${{ steps.generate.outputs.icon_count }}

          ### Changes
          - ${{ steps.check_changes.outputs.update_reason }}
          - Auto-generated from upstream

          ### Installation

          Add to your `Package.swift`:
          ```swift
          dependencies: [
              .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ steps.bump_version.outputs.new_version }}")
          ]
          ```

          ### Version Information

          Access version information in your code:
          ```swift
          import LucideSwift
          
          print(LucideVersions.libraryVersion)  // "${{ steps.bump_version.outputs.new_version }}"
          print(LucideVersions.lucideVersion)   // "${{ steps.lucide_version.outputs.version }}"
          print(LucideVersions.lucideLabVersion) // "${{ steps.lucide_lab_version.outputs.version }}"
          ```
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: sync-and-release
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Print success message
      if: needs.sync-and-release.result == 'success' && needs.sync-and-release.outputs.needs_update == 'true'
      run: |
        echo "✅ Successfully released LucideSwift ${{ needs.sync-and-release.outputs.library_version }}"
        echo "Library: ${{ needs.sync-and-release.outputs.library_version }}"
        echo "Lucide Icons: ${{ needs.sync-and-release.outputs.lucide_version }}"
        echo "Lucide Lab: ${{ needs.sync-and-release.outputs.lucide_lab_version }}"
        echo "Icons: ${{ needs.sync-and-release.outputs.icon_count }}"
        echo "Reason: ${{ needs.sync-and-release.outputs.update_reason }}"
        echo ""
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.sync-and-release.outputs.library_version }}"
    
    - name: Print skip message
      if: needs.sync-and-release.result == 'success' && needs.sync-and-release.outputs.needs_update != 'true'
      run: |
        echo "ℹ️ No update needed - all upstream sources are up to date"
    
    - name: Print failure message
      if: needs.sync-and-release.result == 'failure'
      run: |
        echo "❌ Failed to sync and release"
        exit 1
